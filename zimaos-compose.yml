name: asin-product-watch

services:
  asin-product-watch:
    image: ghcr.io/vdite/asin-product-watch:latest
    container_name: asin-product-watch
    restart: unless-stopped
    ports:
      - target: 8080
        published: "8644"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/asin-product-watch
        target: /data
    environment:
      AMAZON_CREDENTIAL_ID: ""
      AMAZON_CREDENTIAL_SECRET: ""
      AMAZON_CREDENTIAL_VERSION: "3.2"
      AMAZON_PARTNER_TAG: ""
      AMAZON_MARKETPLACE: "www.amazon.de"
      PUSHOVER_APP_TOKEN: ""
      PUSHOVER_USER_KEY: ""
      DEFAULT_CHECK_INTERVAL_MINUTES: "60"
      DEFAULT_PRICE_THRESHOLD_PERCENT: "10"
      MAX_WATCHLIST_SIZE: "500"
      TZ: Europe/Berlin

x-casaos:
  id: de.mizine.asin-product-watch
  main: asin-product-watch
  index: /
  port_map: "8644"
  scheme: http
  icon: https://raw.githubusercontent.com/vdite/asin-product-watch/main/assets/icon.svg
  title:
    en_US: ASIN Product Watch
    de_DE: ASIN Produkt-Wächter
  tagline:
    en_US: Monitor ASIN changes with the official Creators API
    de_DE: ASIN-Änderungen über die offizielle Creators API überwachen
  description:
    en_US: Watches Amazon products through the official Creators API and sends durable Pushover notifications for availability, price and catalog changes.
    de_DE: Beobachtet Amazon-Produkte über die offizielle Creators API und sendet Pushover-Nachrichten bei Verfügbarkeits-, Preis- und Katalogänderungen.
  tips:
    before_install:
      en_US: Enter Creators API and Pushover credentials as environment variables before starting the app.
      de_DE: Vor dem Start die Creators-API- und Pushover-Zugangsdaten als Umgebungsvariablen eintragen.
  author: vdite
  developer: vdite
  category: Others
  architectures:
    - amd64
    - arm64
  version: "1.2.0"
  update_at: "2026-11-07"
  release_notes:
    en_US: Adds a configurable price change threshold (default 10 %) so small price fluctuations no longer trigger notifications; input accepts plain ASINs only; fixes a false recovery notice for vanished products.
    de_DE: Ergänzt eine einstellbare Preisschwelle (Standard 10 %), damit kleine Preisschwankungen keine Nachrichten mehr auslösen; Eingabe nur noch als ASIN; behebt eine falsche Entwarnung bei verschwundenen Produkten.
  repo: https://github.com/vdite/asin-product-watch
  docs: https://github.com/vdite/asin-product-watch#readme
