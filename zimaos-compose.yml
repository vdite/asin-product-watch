name: amazon-product-watch

services:
  amazon-product-watch:
    image: ghcr.io/vdite/amazon-product-watch:latest
    container_name: amazon-product-watch
    restart: unless-stopped
    ports:
      - target: 8080
        published: "8644"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/amazon-product-watch
        target: /data
    environment:
      AMAZON_CREDENTIAL_ID: ""
      AMAZON_CREDENTIAL_SECRET: ""
      AMAZON_CREDENTIAL_VERSION: "3.2"
      AMAZON_PARTNER_TAG: "mizine-21"
      AMAZON_MARKETPLACE: "www.amazon.de"
      PUSHOVER_APP_TOKEN: ""
      PUSHOVER_USER_KEY: ""
      DEFAULT_CHECK_INTERVAL_MINUTES: "60"
      MAX_WATCHLIST_SIZE: "500"
      TZ: Europe/Berlin

x-casaos:
  id: de.mizine.amazon-product-watch
  main: amazon-product-watch
  index: /
  port_map: "8644"
  scheme: http
  icon: https://raw.githubusercontent.com/vdite/amazon-product-watch/main/assets/icon.svg
  title:
    en_US: Amazon Product Watch
    de_DE: Amazon Produkt-Wächter
  tagline:
    en_US: Monitor ASIN changes with Amazon's official API
    de_DE: ASIN-Änderungen über Amazons offizielle API überwachen
  description:
    en_US: Watches Amazon products through the official Creators API and sends durable Pushover notifications for availability, price and catalog changes.
    de_DE: Beobachtet Amazon-Produkte über die offizielle Creators API und sendet Pushover-Nachrichten bei Verfügbarkeits-, Preis- und Katalogänderungen.
  tips:
    before_install:
      en_US: Enter Creators API and Pushover credentials as environment variables before starting the app.
      de_DE: Vor dem Start die Creators-API- und Pushover-Zugangsdaten als Umgebungsvariablen eintragen.
  author: vdite
  developer: vdite
  category: Others
  architectures:
    - amd64
    - arm64
  version: "1.0.4"
  update_at: "2026-11-03"
  release_notes:
    en_US: Adds a plain-text export containing only the watched ASINs, one per line.
    de_DE: Ergänzt einen Klartext-Export nur mit den beobachteten ASINs, jeweils eine pro Zeile.
  repo: https://github.com/vdite/amazon-product-watch
  docs: https://github.com/vdite/amazon-product-watch#readme
